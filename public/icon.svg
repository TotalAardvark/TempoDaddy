<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#262626" stroke-width="12"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#amberGlow)" stroke-width="12" stroke-dasharray="360 830" stroke-linecap="round"/>

  <!-- Center Drum Emoji Icon -->
  <text x="256" y="285" font-size="210" text-anchor="middle" dominant-baseline="central">🥁</text>
</svg>
